<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <section class="left">
      <header>
        <h2>Registeration Process</h2>
        <p>1/2 steps</p>
      </header>

      <ul>
        <li>User Details</li>
        <li>Business details</li>
        <li>Bank Details</li>
      </ul>
    </section>

    <main class="right">
      <header class="right-header">
        <h3>New Customer Registration form</h3>
        <p>Fill out the following basic user details to setup your account</p>
      </header>

      <p class="badge">All fields are required unless specified optional</p>

      <form class="inputs-container" action="">
        <div class="forminput">
          <label for="">Customer's Name</label>
          <input class="form-input" type="text" placeholder="First Name" />
        </div>

        <div class="forminput">
          <label for="">Last Name</label>
          <input class="form-input" type="text" placeholder="Last Name" />
        </div>

        <div class="forminput">
          <label for="">Email Address</label>
          <input class="form-input" type="email" placeholder="Email Address" />
        </div>

        <div class="forminput">
          <label for="">Phone Number</label>
          <input class="form-input" type="tel" placeholder="Phone Number" />
        </div>

        <div class="forminput">
          <label for="">Password</label>
          <input class="form-input" type="password" placeholder="Password" />
        </div>

        <div class="forminput">
          <label for="">Confirm Password</label>
          <input
            class="form-input"
            type="password"
            placeholder="Confirm Password"
          />
        </div>
      </form>

    </main>

      <footer >
        <div class="footer-btns">
          <button class="left-button">Clear</button>
          <button class="right-button">Proceed Next</button>
        </div>
      </footer>

  </body>
</html>
