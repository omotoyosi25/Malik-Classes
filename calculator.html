<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calculator.css">
    <script src="calculator.js" defer></script>
</head>
<body>
    <div class="calculator">
        <section class="display">0</section>
        

        <div class="buttons">
            <button class="btn"></button>
            <button class="btn clear" data-operation="clear">C</button>
            <button class="btn operator" data-operation="divide">/</button>
            <button class="btn operator" data-operation="multiply">X</button>
            
            <button class="btn number" data-value="7" data-value2="77">7</button>
            <button class="btn number" data-value="8">8</button>
            <button class="btn number" data-value="9">9</button>
            <button class="btn operator" data-operation="subtract">-</button>
         
            <button class="btn number" data-value="4">4</button>
            <button class="btn number" data-value="5">5</button>
            <button class="btn number" data-value="6">6</button>
            <button class="btn operator" data-operation="add">+</button>
            
            <button class="btn number" data-value="1">1</button>
            <button class="btn number" data-value="2">2</button>
            <button class="btn number" data-value="3">3</button>
            <button class="btn equals" data-operation="equals">=</button>
           
            <button class="btn number" data-value="0">0</button>
            <button class="btn" data-value=".">.</button>
            
        </div>
        
    </div>
</body>
</html>
